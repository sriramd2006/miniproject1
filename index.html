<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Password Strength Checker</h2>

    <input type="password" id="password" placeholder="Enter Password">

    <div class="strength-bar">
        <div class="strength-fill" id="strengthFill"></div>
    </div>

    <p id="strength-text">Strength:</p>

    <ul>
        <li id="length">Minimum 8 Characters</li>
        <li id="upper">At Least 1 Uppercase Letter</li>
        <li id="lower">At Least 1 Lowercase Letter</li>
        <li id="number">At Least 1 Number</li>
        <li id="special">At Least 1 Special Character</li>
    </ul>
</div>

<script src="script.js"></script>

</body>
</html>
